name: Bundle Audit and Brakeman

on:
  push:
    branches:
      - '*'
      - '**/*'
concurrency:
  group: ${{ github.ref }}-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    # Docker Hub image that the job executes in
    container: ruby:3.4.5-slim-bookworm

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: 'Container Setup'
        id: container-setup
        uses: ./.github/workflows/container_setup

      - name: Run bundle-audit
        run: |
          bundle exec bundle-audit check --update
      - name: Run brakeman
        run: |
          bundle exec brakeman -q --no-pager --except PermitAttributes,Render
