default: &default
  adapter: <%= ENV['DATABASE_ADAPTER'] %>
  host: <%= ENV['DATABASE_HOST'] %>
  pool: 5
  timeout: 5000
  <% if ENV['DATABASE_PORT'] %>
  port: <%= ENV['DATABASE_PORT'] %>
  <% end %>
  <% if ENV['DATABASE_USER'] %>
  username: <%= ENV['DATABASE_USER'] %>
  <% end %>
  <% if ENV['DATABASE_PASS'] %>
  password: <%= ENV['DATABASE_PASS'] %>
  <% end %>
  <% if ENV['DATABASE_HOST'] %>
  host: <%= ENV['DATABASE_HOST'] %>
  <% end %>
  <% if ENV['RAILS_ENV'] == 'production' || ENV['RAILS_ENV'] == 'staging' %>
  sslmode: <%= ENV.fetch('DATABASE_SSLMODE') { 'verify-full' } %>
  sslrootcert: /etc/ssl/certs/us-east-1-bundle.pem
  <% end %>

development:
  primary:
    <<: *default
    database: <%= ENV['DATABASE_APP_DB'] %>
  warehouse:
    <<: *default
    schema_dump: false
    database: <%= ENV['DATABASE_WAREHOUSE_DB'] %>
    <% if ENV['DATABASE_WAREHOUSE_PORT'] %>
    port: <%= ENV['DATABASE_WAREHOUSE_PORT'] %>
    <% end %>

staging:
  primary:
    <<: *default
    database: <%= ENV['DATABASE_APP_DB'] %>
  warehouse:
    <<: *default
    schema_dump: false
    database: <%= ENV['DATABASE_WAREHOUSE_DB'] %>
    <% if ENV['DATABASE_WAREHOUSE_PORT'] %>
    port: <%= ENV['DATABASE_WAREHOUSE_PORT'] %>
    <% end %>

production:
  primary:
    <<: *default
    database: <%= ENV['DATABASE_APP_DB'] %>
  warehouse:
    <<: *default
    schema_dump: false
    database: <%= ENV['DATABASE_WAREHOUSE_DB'] %>
    <% if ENV['DATABASE_WAREHOUSE_PORT'] %>
    port: <%= ENV['DATABASE_WAREHOUSE_PORT'] %>
    <% end %>

test:
  primary:
    <<: *default
    database: <%= ENV['DATABASE_DB_TEST'] %>
  warehouse:
    <<: *default
    schema_dump: false
    database: <%= ENV['DATABASE_WAREHOUSE_DB_TEST'] %>
